<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHNOOR international LLC - Secure Examination Portal</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('app-theme') || localStorage.getItem('shnoor-theme') || 'default';
        var theme = saved === 'leaf' ? 'green' : saved;
        if (theme && theme !== 'default') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) { }
    })();
  </script>
  <meta name="description"
    content="AI-powered secure examination portal. Conduct and manage online assessments with live proctoring, coding challenges, and real-time analytics." />

  <!-- Mobile browser chrome color -->
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />

  <!-- Open Graph — base tags (per-page tags are injected by useSEO hook) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SHNOOR international LLC" />
  <meta property="og:title" content="SHNOOR international LLC - Secure Examination Portal" />
  <meta property="og:description"
    content="AI-powered secure examination portal. Conduct and manage online assessments with live proctoring, coding challenges, and real-time analytics." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SHNOOR international LLC - Secure Examination Portal" />
  <meta name="twitter:description" content="AI-powered secure examination portal with live proctoring." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">

  <!-- Google Font -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap">

  <!-- Critical CSS to prevent flash of unstyled content -->
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <!-- Global polyfill for simple-peer compatibility -->
  <script>
    if (typeof global === 'undefined') {
      var global = globalThis;
    }
  </script>

  <main id="root"></main>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
